[package]
name = "audit-service"
version = "1.0.0"
edition = "2021"
description = "Immutable append-only audit logs microservice for TaskFlow"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

