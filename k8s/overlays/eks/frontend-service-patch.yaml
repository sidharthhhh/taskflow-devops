apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: taskflow
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  $patch: replace
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app: taskflow-frontend

