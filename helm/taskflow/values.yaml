# =============================================================================
#  TaskFlow Helm chart - DEFAULT values (cloud / EKS style)
#
#  How values are layered:
#    values.yaml            <- this file, shared defaults (CI bumps image.tag here)
#    values-local.yaml      <- overrides for the local k3d cluster
#  ArgoCD passes both files:  helm template -f values.yaml -f values-local.yaml
#  (later files win).
# =============================================================================

# -----------------------------------------------------------------------------
# Container images
#   Final image = <registry>/<repository>:<tag>
#   The CD pipeline (.github/workflows/cd-deploy.yml) rewrites `tag` below to the
#   git SHA it just built and commits it -> ArgoCD notices the commit -> rollout.
# -----------------------------------------------------------------------------
image:
  registry: docker.io/sidharthhhh
  tag: latest
  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Shared configuration (rendered into ConfigMaps / Secret)
# -----------------------------------------------------------------------------
taskConfig:            # -> ConfigMap "taskflow-config" (Spring Boot task API)
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: "TaskFlow"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/taskflowdb"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_H2_CONSOLE_ENABLED: "false"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

meshConfig:            # -> ConfigMap "taskflow-mesh-config" (service discovery URLs)
  REDIS_URL: "redis://redis-service:6379"
  TASK_SERVICE_URL: "http://taskflow-service:8080"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3002"
  SCHEDULER_SERVICE_URL: "http://scheduler-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8081"
  AUDIT_SERVICE_URL: "http://audit-service:8082"
  CACHE_TTL_SEC: "10"
  CRON_INTERVAL_MS: "30000"
  AUDIT_LOG_PATH: "/data/audit.jsonl"

# NOTE: dev-only credentials. In a real environment, replace this with
# External Secrets / Sealed Secrets and set `secret.create: false`.
secret:
  create: true
  data:
    SPRING_DATASOURCE_USERNAME: taskflow
    SPRING_DATASOURCE_PASSWORD: taskflowpassword
    POSTGRES_USER: taskflow
    POSTGRES_PASSWORD: taskflowpassword
    POSTGRES_DB: taskflowdb
    JWT_SECRET: taskflow-k8s-dev-jwt-secret-change-in-prod

# -----------------------------------------------------------------------------
# Stateful backing services
# -----------------------------------------------------------------------------
postgres:
  enabled: true
  image: postgres:16-alpine
  storage:
    size: 1Gi
    storageClass: ""     # "" = cluster default StorageClass
  resources:
    requests: { memory: 128Mi, cpu: 100m }
    limits:   { memory: 256Mi, cpu: 250m }

redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests: { memory: 64Mi, cpu: 50m }
    limits:   { memory: 160Mi, cpu: 150m }

# -----------------------------------------------------------------------------
# Microservices
#   Every entry below is rendered by templates/microservices.yaml into a
#   Deployment + Service (+ optional HPA, PDB, PVC, ServiceMonitor).
#   Adding a new service = adding a new block here. No new template needed.
#
#   Keys:
#     name            Deployment name + `app` label
#     serviceName     Kubernetes Service name (defaults to name)
#     image.repository / image.tag (tag optional, falls back to global)
#     port            container + service port
#     health          liveness/readiness HTTP paths, startup=true adds a startupProbe
#     waitForPostgres adds an initContainer that blocks until Postgres is reachable
#     env / envFrom   raw Kubernetes env / envFrom lists
#     data            optional /data volume (emptyDir or PVC when persistence.enabled)
#     metrics         Prometheus scrape config (ServiceMonitor) if the app exposes /metrics
#     service.type    ClusterIP | NodePort | LoadBalancer  (+ service.nodePort)
# -----------------------------------------------------------------------------
services:
  task:
    enabled: true
    name: taskflow-app
    serviceName: taskflow-service
    image: { repository: taskflow-app }
    port: 8080
    waitForPostgres: true
    podSecurityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
    envFrom:
      - configMapRef: { name: taskflow-config }
      - secretRef: { name: taskflow-secret }
    health:
      liveness: /actuator/health/liveness
      readiness: /actuator/health/readiness
      startup: true
    resources:
      requests: { memory: 256Mi, cpu: 200m }
      limits:   { memory: 512Mi, cpu: 500m }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 5, targetCPU: 75 }
    pdb: { enabled: true, minAvailable: 1 }
    metrics: { enabled: true, path: /actuator/prometheus }   # Spring Boot Micrometer
    service: { type: ClusterIP }

  auth:
    enabled: true
    name: auth-service
    image: { repository: taskflow-auth-service }
    port: 3001
    waitForPostgres: true
    podSecurityContext: { runAsNonRoot: true, runAsUser: 1000 }
    env:
      - { name: PGHOST, value: postgres-service }
      - { name: PGPORT, value: "5432" }
      - { name: PGDATABASE, value: authdb }
      - name: PGADMIN_DB
        valueFrom: { secretKeyRef: { name: taskflow-secret, key: POSTGRES_DB } }
      - name: PGUSER
        valueFrom: { secretKeyRef: { name: taskflow-secret, key: POSTGRES_USER } }
      - name: PGPASSWORD
        valueFrom: { secretKeyRef: { name: taskflow-secret, key: POSTGRES_PASSWORD } }
      - name: JWT_SECRET
        valueFrom: { secretKeyRef: { name: taskflow-secret, key: JWT_SECRET } }
    health: { liveness: /health, readiness: /health }
    resources:
      requests: { memory: 64Mi, cpu: 50m }
      limits:   { memory: 128Mi, cpu: 200m }

  analytics:
    enabled: true
    name: analytics-service
    image: { repository: taskflow-analytics-service }
    port: 3002
    podSecurityContext: { runAsNonRoot: true, runAsUser: 1000 }
    envFrom:
      - configMapRef: { name: taskflow-mesh-config }
    health: { liveness: /health, readiness: /health }
    resources:
      requests: { memory: 64Mi, cpu: 50m }
      limits:   { memory: 128Mi, cpu: 200m }

  scheduler:
    enabled: true
    name: scheduler-service
    image: { repository: taskflow-scheduler-service }
    port: 3003
    podSecurityContext: { runAsNonRoot: true, runAsUser: 1000 }
    envFrom:
      - configMapRef: { name: taskflow-mesh-config }
    health: { liveness: /health, readiness: /health }
    resources:
      requests: { memory: 64Mi, cpu: 50m }
      limits:   { memory: 128Mi, cpu: 200m }

  notification:
    enabled: true
    name: notification-service
    image: { repository: taskflow-notification-service }
    port: 8081
    podSecurityContext: { runAsNonRoot: true, runAsUser: 10001 }
    envFrom:
      - configMapRef: { name: taskflow-mesh-config }
    health: { liveness: /health, readiness: /health }
    resources:
      requests: { memory: 32Mi, cpu: 25m }
      limits:   { memory: 64Mi, cpu: 100m }

  audit:
    enabled: true
    name: audit-service
    image: { repository: taskflow-audit-service }
    port: 8082
    podSecurityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
    envFrom:
      - configMapRef: { name: taskflow-mesh-config }
    data:
      mountPath: /data
      persistence: { enabled: false, size: 256Mi, storageClass: "" }
    health: { liveness: /health, readiness: /health }
    resources:
      requests: { memory: 32Mi, cpu: 25m }
      limits:   { memory: 64Mi, cpu: 100m }

  frontend:
    enabled: true
    name: taskflow-frontend
    serviceName: frontend-service
    image: { repository: taskflow-frontend }
    port: 3000
    podSecurityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001 }
    envFrom:
      - configMapRef: { name: taskflow-mesh-config }
    health: { liveness: /api/health, readiness: /api/health }
    resources:
      requests: { memory: 128Mi, cpu: 100m }
      limits:   { memory: 256Mi, cpu: 300m }
    service: { type: LoadBalancer }

# -----------------------------------------------------------------------------
# Monitoring integration (requires kube-prometheus-stack - see monitoring/)
# -----------------------------------------------------------------------------
monitoring:
  # Create ServiceMonitor objects for services with metrics.enabled=true.
  # Needs the monitoring.coreos.com CRDs (installed by kube-prometheus-stack).
  serviceMonitor:
    enabled: true
    interval: 15s
    # Label the Prometheus operator selects on (kube-prometheus-stack default = release name).
    labels:
      release: monitoring
  # Ship the single "TaskFlow Microservices" Grafana dashboard as a ConfigMap.
  # Grafana's sidecar auto-imports any ConfigMap labelled grafana_dashboard=1.
  dashboard:
    enabled: true
    folder: TaskFlow
