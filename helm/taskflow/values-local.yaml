# =============================================================================
#  LOCAL overrides (k3d cluster "taskflow") - layered on top of values.yaml
#
#  Images: NOT overridden here on purpose. The local cluster uses exactly the same
#  images as production: docker.io/sidharthhhh/<service>:<git-sha>, built and pushed
#  by GitHub Actions, with the tag written into values.yaml by the CD pipeline.
#  (Overriding image.registry/tag/pullPolicy here would make the cluster ignore
#  what CI built.)
#
#  Only environment-specific settings live here:
#  NodePorts are mapped to localhost by k3d (see scripts/local-up.sh):
#        http://localhost:30088  -> frontend
#        http://localhost:30080  -> task API (Swagger: /swagger-ui.html)
# =============================================================================
services:
  task:
    service: { type: NodePort, nodePort: 30080 }
  frontend:
    service: { type: NodePort, nodePort: 30088 }
  audit:
    data:
      persistence: { enabled: true }   # k3s ships the local-path StorageClass
