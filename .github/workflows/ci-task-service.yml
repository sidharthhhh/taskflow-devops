name: CI - Java Task Service

on:
  push:
    branches: [microservice, sidharth/feature, main, master]
    paths:
      - 'services/task-service/**'
      - '.github/workflows/ci-task-service.yml'
  pull_request:
    branches: [microservice, sidharth/feature, main, master]
    paths:
      - 'services/task-service/**'
      - '.github/workflows/ci-task-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  maven-test:
    name: Maven Build & Tests (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Verify
        run: mvn -B clean verify --file services/task-service/pom.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-service-surefire-reports
          path: services/task-service/target/surefire-reports/
          retention-days: 7

  docker-build-and-scan:
    name: Docker Build, Trivy Scan & Smoke Test
    runs-on: ubuntu-latest
    needs: [maven-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Task Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/task-service
          file: ./services/task-service/Dockerfile
          load: true
          tags: taskflow-task-service:${{ github.sha }}
          cache-from: type=gha,scope=task-service
          cache-to: type=gha,mode=max,scope=task-service

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-task-service:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-task-service.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-task-service.sarif'
          category: 'task-service'

      - name: Container Smoke Test
        run: |
          docker run -d --name smoke-task -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="jdbc:h2:mem:smoketestdb;DB_CLOSE_DELAY=-1" \
            taskflow-task-service:${{ github.sha }}
          trap 'docker rm -f smoke-task || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "task-service health check passed!"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke-task
          exit 1

