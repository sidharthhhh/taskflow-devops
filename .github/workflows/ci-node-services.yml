name: CI - Node.js Microservices

on:
  push:
    branches: [sidharth/feature, main, master]
    paths:
      - 'services/auth-service/**'
      - 'services/analytics-service/**'
      - 'services/scheduler-service/**'
      - '.github/workflows/ci-node-services.yml'
  pull_request:
    branches: [sidharth/feature, main, master]
    paths:
      - 'services/auth-service/**'
      - 'services/analytics-service/**'
      - 'services/scheduler-service/**'
      - '.github/workflows/ci-node-services.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  node-matrix-ci:
    name: CI (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            port: 3001
          - name: analytics-service
            port: 3002
          - name: scheduler-service
            port: 3003
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service.name }}/package-lock.json

      - name: Install & Syntax Check
        working-directory: services/${{ matrix.service.name }}
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service.name }}
          file: ./services/${{ matrix.service.name }}/Dockerfile
          load: true
          tags: taskflow-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-${{ matrix.service.name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service.name }}.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service.name }}.sarif'
          category: '${{ matrix.service.name }}'

      - name: Container Health Smoke Test
        run: |
          PORT=${{ matrix.service.port }}
          docker run -d --name smoke-${{ matrix.service.name }} -p ${PORT}:${PORT} \
            taskflow-${{ matrix.service.name }}:${{ github.sha }}
          trap "docker rm -f smoke-${{ matrix.service.name }} || true" EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:${PORT}/health | grep -q '"status":"UP"'; then
              echo "${{ matrix.service.name }} health check passed!"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke-${{ matrix.service.name }}
          exit 1

