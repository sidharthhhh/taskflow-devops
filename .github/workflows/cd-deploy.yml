# =============================================================================
#  CD - GitOps: build & push images, then bump the Helm image tag in git.
#
#  Flow (branches: microservice and main):
#    1. push to microservice/main  ->  build all 7 images, push to Docker Hub as :<git-sha>
#    2. rewrite helm/taskflow/values.yaml  image.tag: <git-sha>  and commit it back
#       to the SAME branch that triggered the run (github.ref_name)
#    3. ArgoCD (its Application's targetRevision = the branch it watches) sees the
#       new commit and rolls the cluster forward. No kubectl / cluster credentials in CI.
#
#  Rollback = `git revert` the "deploy: bump image tag" commit (ArgoCD syncs it).
# =============================================================================
name: CD - Build Images & GitOps Deploy (ArgoCD)

on:
  push:
    branches: [microservice, main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - '.github/workflows/cd-deploy.yml'
  workflow_dispatch:

# Never run two tag bumps at the same time (they would race on the same commit).
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write     # needed to commit the tag bump back to the branch

jobs:
  push-images:
    name: Build & Push (${{ matrix.svc.image }})
    runs-on: ubuntu-latest
    # The tag-bump commit itself must not trigger another build loop.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      pushed: ${{ steps.check_dockerhub.outputs.configured }}
    strategy:
      fail-fast: true
      matrix:
        svc:
          - { context: ./services/task-service,         image: taskflow-app }
          - { context: ./services/auth-service,         image: taskflow-auth-service }
          - { context: ./services/analytics-service,    image: taskflow-analytics-service }
          - { context: ./services/scheduler-service,    image: taskflow-scheduler-service }
          - { context: ./services/notification-service, image: taskflow-notification-service }
          - { context: ./services/audit-service,        image: taskflow-audit-service }
          - { context: ./frontend,                      image: taskflow-frontend }
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub Credentials
        id: check_dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning ::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret missing. Skipping push."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.check_dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check_dockerhub.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push to Docker Hub
        if: steps.check_dockerhub.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc.context }}
          file: ${{ matrix.svc.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.svc.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.svc.image }}:latest
          cache-from: type=gha,scope=cd-${{ matrix.svc.image }}
          cache-to: type=gha,mode=max,scope=cd-${{ matrix.svc.image }}

  gitops-bump-tag:
    name: GitOps - bump Helm image tag
    runs-on: ubuntu-latest
    needs: [push-images]
    # Only bump the tag if images were actually pushed (otherwise ArgoCD would
    # try to deploy a tag that doesn't exist).
    if: needs.push-images.outputs.pushed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update image.tag in helm/taskflow/values.yaml
        run: |
          SHA="${{ github.sha }}"
          REGISTRY="docker.io/${{ secrets.DOCKERHUB_USERNAME }}"
          FILE=helm/taskflow/values.yaml
          # Targeted line edits inside the top-level `image:` block only.
          # (yq -i would re-format the whole file and make every deploy diff noisy.)
          sed -i -E "/^image:/,/^[^ #]/ s|^(  tag:).*|\1 ${SHA}|"            "$FILE"
          sed -i -E "/^image:/,/^[^ #]/ s|^(  registry:).*|\1 ${REGISTRY}|"  "$FILE"
          # Sanity check: the rendered value must be exactly the new SHA.
          test "$(yq '.image.tag' "$FILE")" = "$SHA"
          git diff

      - name: Commit & push tag bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/taskflow/values.yaml
          if git diff --cached --quiet; then
            echo "Tag already up to date."; exit 0
          fi
          git commit -m "deploy: bump image tag to ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Summary
        run: |
          {
            echo "### GitOps deploy queued"
            echo "Image tag \`${{ github.sha }}\` committed to \`helm/taskflow/values.yaml\`."
            echo "ArgoCD (Application \`taskflow\`) will sync it within ~1 minute."
          } >> "$GITHUB_STEP_SUMMARY"
