name: CI - Next.js Frontend

on:
  push:
    branches: [sidharth/feature, main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [sidharth/feature, main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  frontend-build:
    name: TypeScript & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, Typecheck & Build
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx tsc --noEmit
          npm run build

  docker-build-and-scan:
    name: Docker Build, Trivy Scan & Smoke Test
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Standalone Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: taskflow-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-frontend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'frontend'

      - name: Container Health Smoke Test
        run: |
          docker run -d --name smoke-frontend -p 3000:3000 \
            taskflow-frontend:${{ github.sha }}
          trap 'docker rm -f smoke-frontend || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"frontend":"UP"'; then
              echo "frontend health check passed!"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke-frontend
          exit 1

