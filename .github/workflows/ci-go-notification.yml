name: CI - Golang Notification Service

on:
  push:
    branches: [sidharth/feature, main, master]
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/ci-go-notification.yml'
  pull_request:
    branches: [sidharth/feature, main, master]
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/ci-go-notification.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  go-test:
    name: Go Vet & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/notification-service/go.sum

      - name: Run Go Vet & Tests
        working-directory: services/notification-service
        run: |
          go vet ./...
          go test -v ./...

  docker-build-and-scan:
    name: Docker Build, Trivy Scan & Smoke Test
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Notification Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification-service
          file: ./services/notification-service/Dockerfile
          load: true
          tags: taskflow-notification-service:${{ github.sha }}
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,mode=max,scope=notification-service

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-notification-service:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-notification-service.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-notification-service.sarif'
          category: 'notification-service'

      - name: Container Health Smoke Test
        run: |
          docker run -d --name smoke-notif -p 8081:8081 \
            taskflow-notification-service:${{ github.sha }}
          trap 'docker rm -f smoke-notif || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8081/health | grep -q '"status":"UP"'; then
              echo "notification-service health check passed!"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke-notif
          exit 1

